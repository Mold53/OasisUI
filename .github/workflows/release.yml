name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }

      - name: Bundle
        run: |
          node build/bundle.mjs
          git diff --exit-code -- dist/OasisUI.lua

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for $version"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: OasisUI ${{ github.ref_name }}
          body_path: notes.md
          files: dist/OasisUI.lua
